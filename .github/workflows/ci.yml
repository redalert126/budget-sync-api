name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://budget:budget@localhost:5432/budget_test
      REDIS_URL: redis://localhost:6379
      # Throwaway key for tests only; production uses a Render secret.
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Apply every migration, roll back the latest, and re-apply it,
      # so a broken down migration is caught before it is needed in an incident.
      - run: npm run migrate:up
      - run: npm run migrate:down
      - run: npm run migrate:up
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
