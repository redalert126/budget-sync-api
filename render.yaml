# Render Blueprint: API, background worker, Postgres and Redis (Key Value).
# Check field names against https://render.com/docs/blueprint-spec before your first deploy.
services:
  - type: web
    name: budget-sync-api
    runtime: node
    plan: free
    buildCommand: npm ci
    # preDeployCommand requires a paid instance. On the free plan, run
    # `npm run migrate:up` from the Render shell after each deploy that adds a migration.
    # preDeployCommand: npm run migrate:up
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: budget-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: budget-redis
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: SENTRY_DSN
        sync: false

  # Background workers are a paid Render instance type. If you stay on the free plan,
  # remove this service and note in the README that sync runs on the paid tier.
  - type: worker
    name: budget-sync-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: budget-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: budget-redis
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: SENTRY_DSN
        sync: false

  - type: keyvalue
    name: budget-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction # BullMQ requires that queued jobs are never evicted

databases:
  - name: budget-db
    plan: free
    postgresMajorVersion: "16"
